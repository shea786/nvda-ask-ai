name: Release

# Builds, signs and publishes a GitHub release when a version tag is pushed, for example v1.2.0 or v1.2.0-beta1.
# The job runs in the "release" environment, which needs a required reviewer and holds the signing key secret
# ASKAI_SIGNING_KEY (see RELEASING.md).
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Check that the tag matches the manifest version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python - <<'EOF'
          import configparser
          parser = configparser.ConfigParser(interpolation=None)
          with open("addon/manifest.ini", encoding="utf-8") as f:
              parser.read_string("[manifest]\n" + f.read())
          print(parser["manifest"]["version"].strip().strip('"'))
          EOF
          )"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match version $MANIFEST_VERSION in addon/manifest.ini. Bump the manifest or fix the tag."
            exit 1
          fi
          echo "version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the add-on
        run: python build.py

      - name: Checksums and release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ADDON="askAI-${VERSION}.nvda-addon"
          if [ ! -f "$ADDON" ]; then
            echo "::error::build.py did not produce $ADDON"
            exit 1
          fi
          sha256sum "$ADDON" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cp tester/TESTING.txt TESTING.txt

      - name: Sign SHA256SUMS.txt
        env:
          ASKAI_SIGNING_KEY: ${{ secrets.ASKAI_SIGNING_KEY }}
        run: |
          if [ -z "$ASKAI_SIGNING_KEY" ]; then
            echo "::error::The ASKAI_SIGNING_KEY secret is missing from the release environment. Installed copies refuse unsigned updates; see RELEASING.md."
            exit 1
          fi
          umask 077
          KEYFILE="$(mktemp "$RUNNER_TEMP/askai-signing-XXXXXX.pem")"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$ASKAI_SIGNING_KEY" > "$KEYFILE"
          openssl pkeyutl -sign -inkey "$KEYFILE" -rawin -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          rm -f "$KEYFILE"

      - name: Verify the signature like installed copies do
        run: python -I tools/release/verify_sums.py SHA256SUMS.txt SHA256SUMS.txt.sig

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ADDON="askAI-${VERSION}.nvda-addon"
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$ADDON" SHA256SUMS.txt SHA256SUMS.txt.sig TESTING.txt \
            --repo "$GITHUB_REPOSITORY" --title "Ask AI ${VERSION}" --generate-notes $PRERELEASE
